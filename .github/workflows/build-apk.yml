name: Build SouthShoreT APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip SouthShoreT project
        run: |
          rm -rf SouthShoreT-v08
          mkdir -p SouthShoreT-v08
          unzip -o SouthShoreT-Android-v0.8.zip -d SouthShoreT-v08

          if [ ! -f SouthShoreT-v08/settings.gradle.kts ]; then
            PROJECT_ROOT=$(find SouthShoreT-v08 -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)

            if [ -z "$PROJECT_ROOT" ]; then
              echo "Could not locate settings.gradle.kts after extraction"
              find SouthShoreT-v08 -maxdepth 3 -type f -print
              exit 1
            fi

            shopt -s dotglob nullglob
            mv "$PROJECT_ROOT"/* SouthShoreT-v08/
          fi

      - name: Copy Gradle properties
        run: cp gradle.properties SouthShoreT-v08/gradle.properties

      - name: Set Java 17 compatibility
        run: |
          sed -i '/android {/a\    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }' SouthShoreT-v08/app/build.gradle.kts

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: SouthShoreT-v08
        run: gradle assembleDebug

      - name: Upload SouthShoreT APK
        uses: actions/upload-artifact@v4
        with:
          name: SouthShoreT-APK
          path: SouthShoreT-v08/app/build/outputs/apk/debug/app-debug.apk

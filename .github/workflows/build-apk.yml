name: Build SouthShoreT APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip SouthShoreT project
        run: unzip -o SouthShoreT-Android-v0.1.zip

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: SouthShoreT-Android-v0.1/SouthShoreT
        run: gradle assembleDebug

      - name: Upload SouthShoreT APK
        uses: actions/upload-artifact@v4
        with:
          name: SouthShoreT-APK
          path: SouthShoreT-Android-v0.1/SouthShoreT/app/build/outputs/apk/debug/app-debug.apk
